{% extends "base.html" %}
{% block title %}Delete Item{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-20">

    <div class="tron-card text-center">

        <!-- WARNING ICON -->
        <div class="text-5xl mb-4 text-orange-400">
            ⚠
        </div>

        <!-- TITLE -->
        <h2 class="text-2xl font-bold text-orange-400 mb-4">
            Delete Item
        </h2>

        <!-- MESSAGE -->
        <p class="text-gray-300 mb-6 leading-relaxed">
            Are you sure you want to permanently delete
            <span class="text-cyan-400 font-semibold">
                "{{ item.title }}"
            </span>?
        </p>

        <!-- ACTIONS -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <button type="submit"
                    class="tron-btn-orange w-full">
                Yes, Delete Permanently
            </button>
        </form>

        <a href="{% url 'home' %}"
           class="tron-btn-cyan inline-block mt-4 w-full text-center">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
