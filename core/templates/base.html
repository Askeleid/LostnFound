{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Lost & Found{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        header nav a { margin-right: 15px; text-decoration: none; font-weight: bold; }
        hr { margin: 20px 0; }
        ul { list-style-type: disc; margin-left: 20px; }
        button, a { padding: 3px 8px; margin-left: 5px; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="{% url 'home' %}">Dashboard</a>
        <a href="{% url 'create_item' %}">Add Item</a>
        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; 2026 Lost & Found System</p>
</footer>

</body>
</html>
