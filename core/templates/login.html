{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="max-w-md mx-auto tron-card mt-10">

    <h2 class="text-2xl font-bold mb-6 text-cyan-300">
        Login
    </h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <!-- Username -->
        <div>
            <label class="tron-label">Username</label>
            {{ form.username }}
        </div>

        <!-- Password -->
        <div>
            <label class="tron-label">Password</label>
            {{ form.password }}
        </div>

        <!-- Hint / Info -->
        <div class="text-xs text-orange-400 space-y-1 leading-relaxed mt-2">
            <p>Enter your credentials to access the system.</p>
            <p>Make sure to double check your username and password.</p>
        </div>

        <button class="tron-btn-cyan w-full mt-4">
            Login
        </button>
    </form>

    <p class="text-sm mt-5 text-gray-400">
        New here?
        <a class="text-cyan-400 hover:text-cyan-300 ml-1"
           href="{% url 'register' %}">
            Create account
        </a>
    </p>

</div>

{% endblock %}
