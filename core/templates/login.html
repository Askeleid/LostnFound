{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded shadow mt-10">

    <h2 class="text-2xl font-bold mb-4">Login</h2>

    <form method="post" class="space-y-3">
        {% csrf_token %}

        <div>
            {{ form.username.label_tag }}
            {{ form.username }}
        </div>

        <div>
            {{ form.password.label_tag }}
            {{ form.password }}
        </div>

        <button class="w-full bg-blue-600 text-white py-2 rounded mt-3">
            Login
        </button>
    </form>

    <p class="text-sm mt-4">
        New here?
        <a class="text-blue-600" href="{% url 'register' %}">Create account</a>
    </p>

</div>

{% endblock %}
