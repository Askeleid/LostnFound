{% extends "base.html" %}
{% block title %}Create Item{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white p-6 rounded shadow mt-10">

    <h1 class="text-2xl font-bold mb-4">Create Item</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        {{ form.as_p }}

        <!-- IMAGE PREVIEW -->
        <div id="preview-box" class="hidden mt-4">
            <p class="text-sm text-gray-600">Image preview:</p>
            <img id="preview-img" class="w-40 mt-2 rounded border">
        </div>

        <button class="w-full bg-blue-600 text-white py-2 rounded mt-4">
            Post Item
        </button>
    </form>

</div>

<script>
const input = document.querySelector('input[type="file"]');
const previewBox = document.getElementById("preview-box");
const previewImg = document.getElementById("preview-img");

if (input) {
    input.addEventListener("change", function () {
        const file = this.files[0];

        if (file) {
            const reader = new FileReader();

            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewBox.classList.remove("hidden");
            };

            reader.readAsDataURL(file);
        }
    });
}
</script>

{% endblock %}
